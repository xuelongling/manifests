# SPDX-License-Identifier: MIT

name: Release Provisional Inputs

on:
  workflow_dispatch:
    inputs:
      product_version:
        description: Release Product Version without the tsfg-v prefix
        required: true
        type: string
      candidate_id:
        description: Exact Verified Candidate content address
        required: true
        type: string
      candidate_run_id:
        description: Successful Manifest PR run containing the Verified Candidate verdict
        required: true
        type: string
      candidate_artifact:
        description: Exact manifest-verdict artifact name from the Candidate run
        required: true
        type: string
      offline_proof_run_id:
        description: Successful trusted Tier 1 Offline Proof run
        required: true
        type: string
      owner_approval_base64:
        description: Exact pre-authored owner-approval.json bytes, base64 encoded; this workflow never creates an approval
        required: true
        type: string
      owner_approval_sha256:
        description: Exact sha256-prefixed digest independently confirmed by the human Release Owner
        required: true
        type: string
      version_readiness_base64:
        description: Exact pre-authored version-readiness.json bytes, base64 encoded
        required: true
        type: string
      product_tag_base64:
        description: Exact pre-authored product-tag.json bytes for an already-existing immutable tag
        required: true
        type: string
      release_materials_base64:
        description: Exact pre-authored release-materials.json bytes for already-fixed non-Stable materials
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-provisional-inputs
  cancel-in-progress: false

jobs:
  stage-provisional-inputs:
    name: Validate and stage human-provided release inputs
    runs-on: ubuntu-24.04
    environment: protected-release-environment
    steps:
      - name: Fail closed outside an exact same-human protected-main dispatch
        env:
          TSFG_ACTOR: ${{ github.actor }}
          TSFG_CANDIDATE_ID: ${{ inputs.candidate_id }}
          TSFG_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          TSFG_OFFLINE_PROOF_RUN_ID: ${{ inputs.offline_proof_run_id }}
          TSFG_OWNER_APPROVAL_SHA256: ${{ inputs.owner_approval_sha256 }}
          TSFG_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          TSFG_VERSION: ${{ inputs.product_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = xuelongling/manifests
          test "$TSFG_ACTOR" = "$TSFG_TRIGGERING_ACTOR"
          case "$TSFG_ACTOR" in *'[bot]'|github-actions) exit 1 ;; esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TSFG_CANDIDATE_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TSFG_CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TSFG_OFFLINE_PROOF_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TSFG_OWNER_APPROVAL_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$TSFG_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/heads/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - name: Verify exact protected main and fetch API-backed provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TSFG_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          TSFG_OFFLINE_PROOF_RUN_ID: ${{ inputs.offline_proof_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          mkdir -p .ci/release-inputs/api .ci/release-inputs/explicit
          for specification in \
            "workflow-run.json:actions/runs/$GITHUB_RUN_ID" \
            "reviews.json:actions/runs/$GITHUB_RUN_ID/approvals" \
            "candidate-run.json:actions/runs/$TSFG_CANDIDATE_RUN_ID" \
            "candidate-artifacts.json:actions/runs/$TSFG_CANDIDATE_RUN_ID/artifacts?per_page=100" \
            "offline-proof-run.json:actions/runs/$TSFG_OFFLINE_PROOF_RUN_ID" \
            "offline-proof-artifacts.json:actions/runs/$TSFG_OFFLINE_PROOF_RUN_ID/artifacts?per_page=100"
          do
            name=${specification%%:*}
            endpoint=${specification#*:}
            curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$endpoint" \
              --output ".ci/release-inputs/api/$name"
          done
      - name: Materialize exact human-authored release records without synthesizing approval
        env:
          TSFG_OWNER_APPROVAL: ${{ inputs.owner_approval_base64 }}
          TSFG_PRODUCT_TAG: ${{ inputs.product_tag_base64 }}
          TSFG_RELEASE_MATERIALS: ${{ inputs.release_materials_base64 }}
          TSFG_VERSION_READINESS: ${{ inputs.version_readiness_base64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TSFG_OWNER_APPROVAL" | base64 --decode > .ci/release-inputs/explicit/owner-approval.json
          printf '%s' "$TSFG_PRODUCT_TAG" | base64 --decode > .ci/release-inputs/explicit/product-tag.json
          printf '%s' "$TSFG_RELEASE_MATERIALS" | base64 --decode > .ci/release-inputs/explicit/release-materials.json
          printf '%s' "$TSFG_VERSION_READINESS" | base64 --decode > .ci/release-inputs/explicit/version-readiness.json
      - name: Download the exact Verified Candidate verdict
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          name: ${{ inputs.candidate_artifact }}
          path: .ci/release-inputs/candidate
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download the exact trusted Offline Proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          name: tier1-offline-proof-${{ inputs.candidate_id }}
          path: .ci/release-inputs/offline-proof
          run-id: ${{ inputs.offline_proof_run_id }}
      - name: Resolve the already-existing immutable Product tag
        env:
          TSFG_VERSION: ${{ inputs.product_version }}
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --tags https://github.com/xuelongling/tsfg.git \
            "refs/tags/tsfg-v$TSFG_VERSION" "refs/tags/tsfg-v$TSFG_VERSION^{}" \
            > .ci/release-inputs/api/product-tag-refs.txt
          test -s .ci/release-inputs/api/product-tag-refs.txt
      - name: Validate and content-address the complete provisional bundle
        env:
          TSFG_ACTOR: ${{ github.actor }}
          TSFG_CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          TSFG_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          TSFG_OFFLINE_PROOF_RUN_ID: ${{ inputs.offline_proof_run_id }}
          TSFG_OWNER_APPROVAL_SHA256: ${{ inputs.owner_approval_sha256 }}
          TSFG_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          TSFG_VERSION: ${{ inputs.product_version }}
        shell: bash
        run: >-
          node tools/manifest-ci.mjs prepare-release-bundle
          --repository . --version "$TSFG_VERSION"
          --verified-candidate .ci/release-inputs/candidate/manifest-verdict.json
          --offline-proof .ci/release-inputs/offline-proof/offline-proof.json
          --owner-approval .ci/release-inputs/explicit/owner-approval.json
          --owner-approval-sha256 "$TSFG_OWNER_APPROVAL_SHA256"
          --version-readiness .ci/release-inputs/explicit/version-readiness.json
          --product-tag .ci/release-inputs/explicit/product-tag.json
          --release-materials .ci/release-inputs/explicit/release-materials.json
          --workflow-run .ci/release-inputs/api/workflow-run.json
          --reviews .ci/release-inputs/api/reviews.json
          --run-id "$GITHUB_RUN_ID" --actor "$TSFG_ACTOR" --triggering-actor "$TSFG_TRIGGERING_ACTOR"
          --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --candidate-id "$TSFG_CANDIDATE_ID"
          --candidate-run .ci/release-inputs/api/candidate-run.json
          --candidate-run-id "$TSFG_CANDIDATE_RUN_ID"
          --candidate-artifacts .ci/release-inputs/api/candidate-artifacts.json
          --candidate-artifact "$TSFG_CANDIDATE_ARTIFACT"
          --offline-proof-run .ci/release-inputs/api/offline-proof-run.json
          --offline-proof-run-id "$TSFG_OFFLINE_PROOF_RUN_ID"
          --offline-proof-artifacts .ci/release-inputs/api/offline-proof-artifacts.json
          --tag-refs .ci/release-inputs/api/product-tag-refs.txt
          --out .ci/release-inputs/bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: release-provisional-inputs-${{ inputs.candidate_id }}
          path: .ci/release-inputs/bundle/
          retention-days: 90
