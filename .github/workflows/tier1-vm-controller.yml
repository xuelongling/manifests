# SPDX-License-Identifier: MIT

name: Tier 1 VM Controller

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        required: true
        type: string
        description: Workflow run containing the Verified Candidate evidence and verdict
      candidate_id:
        required: true
        type: string
        description: Complete resolved-manifest content address to prove

permissions:
  actions: read
  contents: read

jobs:
  prove-minimum-vms:
    name: Prove minimum Tier 1 VMs
    runs-on: [self-hosted, tsfg-tier1-vm-controller]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - name: Download the immutable Verified Candidate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .ci/candidate-evidence
          pattern: manifest-candidate-evidence-*
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download the Verified Candidate verdict
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .ci/verified-verdict
          pattern: manifest-verdict-*
          run-id: ${{ inputs.candidate_run_id }}
      - name: Authenticate and verify the Candidate before VM execution
        env:
          GH_TOKEN: ${{ github.token }}
          TSFG_CANDIDATE_ID: ${{ inputs.candidate_id }}
          TSFG_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TSFG_CANDIDATE_RUN_ID -cnotmatch '^[1-9][0-9]*$') {
            throw 'candidate_run_id must be a positive decimal workflow run ID'
          }
          if ($env:TSFG_CANDIDATE_ID -cnotmatch '^[0-9a-f]{64}$') {
            throw 'candidate_id must be a complete lowercase SHA-256 value'
          }
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:TSFG_CANDIDATE_RUN_ID" `
            -Headers $headers `
            -OutFile .ci/candidate-run.json
          $candidateRun = Get-Content -LiteralPath .ci/candidate-run.json -Raw | ConvertFrom-Json
          if ($candidateRun.head_sha -cnotmatch '^[0-9a-f]{40}$') {
            throw 'candidate run must expose a complete head OID'
          }
          $candidatePulls = @(
            Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$($candidateRun.head_sha)/pulls" `
              -Headers $headers
          )
          if (
            $candidatePulls.Count -ne 1 -or
            $candidatePulls[0].number -notmatch '^[1-9][0-9]*$' -or
            $candidatePulls[0].head.sha -cne $candidateRun.head_sha -or
            $candidatePulls[0].base.ref -cne 'main'
          ) {
            throw 'candidate head must bind exactly one canonical main pull request'
          }
          # GitHub may empty workflow_run.pull_requests after a linear rebase merge.
          # Rehydrate that mutable association from the immutable head commit API.
          $candidateRun.pull_requests = $candidatePulls
          $candidateRun | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath .ci/candidate-run.json -Encoding utf8
          $candidatePr = [string]$candidatePulls[0].number
          $candidateHead = [string]$candidatePulls[0].head.sha
          & git fetch --no-tags --force origin "refs/pull/$candidatePr/head:refs/tsfg-proof/candidate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resolvedHead = (& git rev-parse refs/tsfg-proof/candidate).Trim()
          if ($LASTEXITCODE -ne 0 -or $resolvedHead -cne $candidateHead) {
            throw 'candidate pull request ref does not match the workflow run head OID'
          }
          & node tools/manifest-ci.mjs candidate-proof-input `
            --repository . `
            --candidate-evidence .ci/candidate-evidence `
            --verified-verdict .ci/verified-verdict/manifest-verdict.json `
            --candidate-id $env:TSFG_CANDIDATE_ID `
            --candidate-run .ci/candidate-run.json `
            --candidate-run-id $env:TSFG_CANDIDATE_RUN_ID `
            --out .ci/verified-candidate.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay the candidate through the isolated minimum VMs
        env:
          TSFG_CANDIDATE_ID: ${{ inputs.candidate_id }}
          TSFG_CONTROLLER_EXECUTABLE: ${{ vars.TSFG_TIER1_VM_CONTROLLER }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (
            [string]::IsNullOrWhiteSpace($env:TSFG_CONTROLLER_EXECUTABLE) -or
            -not [IO.Path]::IsPathFullyQualified($env:TSFG_CONTROLLER_EXECUTABLE) -or
            -not (Test-Path -LiteralPath $env:TSFG_CONTROLLER_EXECUTABLE -PathType Leaf)
          ) {
            throw 'TSFG_TIER1_VM_CONTROLLER must name the trusted absolute controller executable'
          }
          & $env:TSFG_CONTROLLER_EXECUTABLE `
            --candidate-id $env:TSFG_CANDIDATE_ID `
            --candidate-evidence .ci/candidate-evidence `
            --verified-input .ci/verified-candidate.json `
            --out .ci/proof-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish the closed VM proof artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: tier1-vm-controller-${{ inputs.candidate_id }}
          path: .ci/proof-evidence
          retention-days: 90
